{% extends "studio/base.html" %}
{% block page_title %}Delete {{ section.singular }}{% endblock %}
{% block content %}
<div class="max-w-md rounded-xl border border-red-500/30 bg-red-500/5 p-6">
  <h2 class="text-white font-semibold mb-2">Delete this {{ section.singular|lower }}?</h2>
  <p class="text-sm text-gray-400 mb-5">"{{ obj }}" will be permanently removed. This can't be undone.</p>
  <form method="post" class="flex gap-3">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <button type="submit" class="bg-red-600 hover:bg-red-500 text-white text-sm px-5 py-2.5 rounded-lg">Yes, delete it</button>
    <a href="javascript:history.back()" class="border border-white/20 hover:border-white/40 text-sm px-5 py-2.5 rounded-lg">Cancel</a>
  </form>
</div>
{% endblock %}
